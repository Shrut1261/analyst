<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title description">
  <title id="title">DenialGuard AI</title>
  <desc id="description">Project illustration for claims to review. Claim data, Risk scoring, Review queue.</desc>
  <style>
    svg { --accent: #bb9df5; }
    @media (prefers-reduced-motion: no-preference) {
      .trace { stroke-dasharray: 1; animation: draw 1.1s ease-out both; }
      .signal { transform-box: fill-box; transform-origin: center; animation: arrive .8s ease-out both; }
      .signal.late { animation-delay: .28s; }
      .columns { transform-box: fill-box; transform-origin: bottom; animation: rise .95s ease-out both; }
      @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
      @keyframes arrive { from { opacity: .34; transform: scale(.92); } to { opacity: 1; transform: scale(1); } }
      @keyframes rise { from { opacity: .55; transform: scaleY(.4); } to { opacity: 1; transform: scaleY(1); } }
    }
  </style>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#141121"/><stop offset="1" stop-color="#262039"/>
    </linearGradient>
    <linearGradient id="area" x2="0" y2="1">
      <stop stop-color="#bb9df5" stop-opacity=".36"/><stop offset="1" stop-color="#bb9df5" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="27" height="27" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cab9eb" fill-opacity=".2"/>
    </pattern>
  </defs>
  <rect width="960" height="560" fill="url(#background)"/>
  <rect x="423" y="56" width="486" height="391" rx="26" fill="#171425" stroke="#55476e"/>
  <rect x="424" y="57" width="484" height="389" rx="25" fill="url(#grid)"/>
  <path d="M423 103h486M423 401h486" stroke="#463b5c"/>
  <circle cx="451" cy="81" r="4" fill="#bb9df5"/>
  <text x="465" y="86" fill="#d9c9ee" font-family="Consolas, monospace" font-size="13" letter-spacing="1.2">PROJECT ILLUSTRATION</text>
  <text x="50" y="113" fill="#bb9df5" font-family="Consolas, monospace" font-size="16" font-weight="700" letter-spacing="1.4">HEALTHCARE ANALYTICS</text>
  <text x="47" y="204" fill="#f7f3ff" font-family="Segoe UI, Arial, sans-serif" font-size="43" font-weight="700" letter-spacing="-1.5"><tspan x="47" dy="0">DenialGuard</tspan><tspan x="47" dy="51">AI</tspan></text>
  <path d="M51 314h55" stroke="#bb9df5" stroke-width="4" stroke-linecap="round"/>
  <text x="50" y="357" fill="#d1c6df" font-family="Segoe UI, Arial, sans-serif" font-size="20">Claims to review</text>
  <path class="trace" pathLength="1" d="M668 133 776 180v62c0 66-42 113-108 147-66-34-108-81-108-147v-62z" fill="var(--accent)" fill-opacity=".12" stroke="var(--accent)" stroke-width="3"/><path class="trace" pathLength="1" d="m620 253 34 35 64-75" fill="none" stroke="var(--accent)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M460 255h100m216 0h112" stroke="var(--accent)" stroke-opacity=".4" stroke-dasharray="5 7"/><circle class="signal" cx="470" cy="255" r="8" fill="var(--accent)"/><circle class="signal late" cx="877" cy="255" r="8" fill="var(--accent)"/>
  <g fill="#e0d3ef" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle">
    <text x="505" y="430">Claim data</text>
    <text x="665" y="430">Risk scoring</text>
    <text x="825" y="430">Review queue</text>
  </g>
  <path d="M51 496h858" stroke="#574a6b"/>
  <text x="50" y="523" fill="#c5b5d9" font-family="Consolas, monospace" font-size="14" letter-spacing="1.25">SHRUT D. PRAJAPATI</text>
  <text x="908" y="523" text-anchor="end" fill="#c5b5d9" font-family="Consolas, monospace" font-size="14" letter-spacing="1.25">SELECTED WORK</text>
</svg>
