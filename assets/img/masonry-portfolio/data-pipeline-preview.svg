<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title description">
  <title id="title">Analytics Warehouse</title>
  <desc id="description">Project illustration for reliable reporting data. Raw inputs, Quality checks, KPI marts.</desc>
  <style>
    svg { --accent: #efb68c; }
    @media (prefers-reduced-motion: no-preference) {
      .trace { stroke-dasharray: 1; animation: draw 1.1s ease-out both; }
      .signal { transform-box: fill-box; transform-origin: center; animation: arrive .8s ease-out both; }
      .signal.late { animation-delay: .28s; }
      .columns { transform-box: fill-box; transform-origin: bottom; animation: rise .95s ease-out both; }
      @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
      @keyframes arrive { from { opacity: .34; transform: scale(.92); } to { opacity: 1; transform: scale(1); } }
      @keyframes rise { from { opacity: .55; transform: scaleY(.4); } to { opacity: 1; transform: scaleY(1); } }
    }
  </style>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#141121"/><stop offset="1" stop-color="#262039"/>
    </linearGradient>
    <linearGradient id="area" x2="0" y2="1">
      <stop stop-color="#efb68c" stop-opacity=".36"/><stop offset="1" stop-color="#efb68c" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="27" height="27" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cab9eb" fill-opacity=".2"/>
    </pattern>
  </defs>
  <rect width="960" height="560" fill="url(#background)"/>
  <rect x="423" y="56" width="486" height="391" rx="26" fill="#171425" stroke="#55476e"/>
  <rect x="424" y="57" width="484" height="389" rx="25" fill="url(#grid)"/>
  <path d="M423 103h486M423 401h486" stroke="#463b5c"/>
  <circle cx="451" cy="81" r="4" fill="#efb68c"/>
  <text x="465" y="86" fill="#d9c9ee" font-family="Consolas, monospace" font-size="13" letter-spacing="1.2">PROJECT ILLUSTRATION</text>
  <text x="50" y="113" fill="#efb68c" font-family="Consolas, monospace" font-size="16" font-weight="700" letter-spacing="1.4">DATA ENGINEERING</text>
  <text x="47" y="204" fill="#f7f3ff" font-family="Segoe UI, Arial, sans-serif" font-size="43" font-weight="700" letter-spacing="-1.5"><tspan x="47" dy="0">Analytics</tspan><tspan x="47" dy="51">Warehouse</tspan></text>
  <path d="M51 314h55" stroke="#efb68c" stroke-width="4" stroke-linecap="round"/>
  <text x="50" y="357" fill="#d1c6df" font-family="Segoe UI, Arial, sans-serif" font-size="20">Reliable reporting data</text>
  <g class="signal" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"><path d="m501 292 166 78 168-78-168-78z" fill="#251f32"/><path d="m501 246 166 78 168-78-168-78z" fill="#312739"/><path d="m501 201 166 78 168-78-168-78z" fill="var(--accent)" fill-opacity=".2"/></g><path class="trace" pathLength="1" d="m570 200 97-46 99 46-99 46z" fill="none" stroke="var(--accent)" stroke-width="3"/><circle class="signal late" cx="667" cy="200" r="8" fill="var(--accent)"/>
  <g fill="#e0d3ef" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle">
    <text x="505" y="430">Raw inputs</text>
    <text x="665" y="430">Quality checks</text>
    <text x="825" y="430">KPI marts</text>
  </g>
  <path d="M51 496h858" stroke="#574a6b"/>
  <text x="50" y="523" fill="#c5b5d9" font-family="Consolas, monospace" font-size="14" letter-spacing="1.25">SHRUT D. PRAJAPATI</text>
  <text x="908" y="523" text-anchor="end" fill="#c5b5d9" font-family="Consolas, monospace" font-size="14" letter-spacing="1.25">SELECTED WORK</text>
</svg>
