<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title description">
  <title id="title">JobPilot</title>
  <desc id="description">Project illustration for job applications workflow. Parse, Assess, Draft.</desc>
  <style>
    svg { --accent: #bdacf8; }
    @media (prefers-reduced-motion: no-preference) {
      .trace { stroke-dasharray: 1; animation: draw 1.1s ease-out both; }
      .signal { transform-box: fill-box; transform-origin: center; animation: arrive .8s ease-out both; }
      .signal.late { animation-delay: .28s; }
      .columns { transform-box: fill-box; transform-origin: bottom; animation: rise .95s ease-out both; }
      @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
      @keyframes arrive { from { opacity: .34; transform: scale(.92); } to { opacity: 1; transform: scale(1); } }
      @keyframes rise { from { opacity: .55; transform: scaleY(.4); } to { opacity: 1; transform: scaleY(1); } }
    }
  </style>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#141121"/><stop offset="1" stop-color="#262039"/>
    </linearGradient>
    <linearGradient id="area" x2="0" y2="1">
      <stop stop-color="#bdacf8" stop-opacity=".36"/><stop offset="1" stop-color="#bdacf8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="27" height="27" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cab9eb" fill-opacity=".2"/>
    </pattern>
  </defs>
  <rect width="960" height="560" fill="url(#background)"/>
  <rect x="423" y="56" width="486" height="391" rx="26" fill="#171425" stroke="#55476e"/>
  <rect x="424" y="57" width="484" height="389" rx="25" fill="url(#grid)"/>
  <path d="M423 103h486M423 401h486" stroke="#463b5c"/>
  <circle cx="451" cy="81" r="4" fill="#bdacf8"/>
  <text x="465" y="86" fill="#d9c9ee" font-family="Consolas, monospace" font-size="13" letter-spacing="1.2">PROJECT ILLUSTRATION</text>
  <text x="50" y="113" fill="#bdacf8" font-family="Consolas, monospace" font-size="16" font-weight="700" letter-spacing="1.4">AGENTIC AI</text>
  <text x="47" y="204" fill="#f7f3ff" font-family="Segoe UI, Arial, sans-serif" font-size="43" font-weight="700" letter-spacing="-1.5"><tspan x="47" dy="0">JobPilot</tspan></text>
  <path d="M51 314h55" stroke="#bdacf8" stroke-width="4" stroke-linecap="round"/>
  <text x="50" y="357" fill="#d1c6df" font-family="Segoe UI, Arial, sans-serif" font-size="20">Job applications workflow</text>
  <path class="trace" pathLength="1" d="M504 238h106l58-67 58 67h104M668 171v137" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/><g class="signal" fill="#242036" stroke="var(--accent)" stroke-width="2.5"><rect x="472" y="208" width="64" height="60" rx="13"/><rect x="636" y="141" width="64" height="60" rx="13"/><rect x="798" y="208" width="64" height="60" rx="13"/><rect x="636" y="290" width="64" height="60" rx="13"/></g><g fill="var(--accent)"><circle cx="504" cy="238" r="6"/><circle cx="668" cy="171" r="6"/><circle cx="830" cy="238" r="6"/><circle cx="668" cy="320" r="6"/></g>
  <g fill="#e0d3ef" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle">
    <text x="505" y="430">Parse</text>
    <text x="665" y="430">Assess</text>
    <text x="825" y="430">Draft</text>
