<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title description">
  <title id="title">ICPC World Finals</title>
  <desc id="description">Project illustration for explore contest performance. Rankings, Regions, Medals.</desc>
  <style>
    svg { --accent: #88d4d0; }
    @media (prefers-reduced-motion: no-preference) {
      .trace { stroke-dasharray: 1; animation: draw 1.1s ease-out both; }
      .signal { transform-box: fill-box; transform-origin: center; animation: arrive .8s ease-out both; }
      .signal.late { animation-delay: .28s; }
      .columns { transform-box: fill-box; transform-origin: bottom; animation: rise .95s ease-out both; }
      @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
      @keyframes arrive { from { opacity: .34; transform: scale(.92); } to { opacity: 1; transform: scale(1); } }
      @keyframes rise { from { opacity: .55; transform: scaleY(.4); } to { opacity: 1; transform: scaleY(1); } }
    }
  </style>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#141121"/><stop offset="1" stop-color="#262039"/>
    </linearGradient>
    <linearGradient id="area" x2="0" y2="1">
      <stop stop-color="#88d4d0" stop-opacity=".36"/><stop offset="1" stop-color="#88d4d0" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="27" height="27" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cab9eb" fill-opacity=".2"/>
    </pattern>
  </defs>
  <rect width="960" height="560" fill="url(#background)"/>
  <rect x="423" y="56" width="486" height="391" rx="26" fill="#171425" stroke="#55476e"/>
  <rect x="424" y="57" width="484" height="389" rx="25" fill="url(#grid)"/>
  <path d="M423 103h486M423 401h486" stroke="#463b5c"/>
  <circle cx="451" cy="81" r="4" fill="#88d4d0"/>
  <text x="465" y="86" fill="#d9c9ee" font-family="Consolas, monospace" font-size="13" letter-spacing="1.2">PROJECT ILLUSTRATION</text>
  <text x="50" y="113" fill="#88d4d0" font-family="Consolas, monospace" font-size="16" font-weight="700" letter-spacing="1.4">BUSINESS INTELLIGENCE</text>
  <text x="47" y="204" fill="#f7f3ff" font-family="Segoe UI, Arial, sans-serif" font-size="43" font-weight="700" letter-spacing="-1.5"><tspan x="47" dy="0">ICPC World</tspan><tspan x="47" dy="51">Finals</tspan></text>
  <path d="M51 314h55" stroke="#88d4d0" stroke-width="4" stroke-linecap="round"/>
  <text x="50" y="357" fill="#d1c6df" font-family="Segoe UI, Arial, sans-serif" font-size="20">Explore contest performance</text>
  <path d="M475 146v218h404M476 200h402M476 255h402M476 310h402" fill="none" stroke="#8880a9" stroke-opacity=".4"/><g class="columns" fill="var(--accent)"><rect x="504" y="282" width="46" height="82" rx="6" opacity=".55"/><rect x="575" y="250" width="46" height="114" rx="6" opacity=".68"/><rect x="646" y="225" width="46" height="139" rx="6" opacity=".8"/><rect x="717" y="169" width="46" height="195" rx="6"/><rect x="788" y="201" width="46" height="163" rx="6" opacity=".88"/></g>
  <g fill="#e0d3ef" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle">
    <text x="505" y="430">Rankings</text>
    <text x="665" y="430">Regions</text>
    <text x="825" y="430">Medals</text>
  </g>
  <path d="M51 496h858" stroke="#574a6b"/>
  <text x="50" y="523" fill="#c5b5d9" font-family="Consolas, monospace" font-size="14" letter-spacing="1.25">SHRUT D. PRAJAPATI</text>
  <text x="908" y="523" text-anchor="end" fill="#c5b5d9" font-family="Consolas, monospace" font-size="14" letter-spacing="1.25">SELECTED WORK</text>
</svg>
