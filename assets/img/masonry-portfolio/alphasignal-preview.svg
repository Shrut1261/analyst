<svg width="900" height="680" viewBox="0 0 900 680" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .equity-line {
      stroke-dasharray: 780;
      stroke-dashoffset: 780;
      animation: drawLine 2.8s ease-out infinite alternate;
    }
    .benchmark-line {
      stroke-dasharray: 680;
      stroke-dashoffset: 680;
      animation: drawLine 3.2s ease-out infinite alternate;
    }
    .bar {
      transform-origin: bottom;
      animation: growBar 1.8s ease-in-out infinite alternate;
    }
    .bar:nth-of-type(2) { animation-delay: .2s; }
    .bar:nth-of-type(3) { animation-delay: .4s; }
    .bar:nth-of-type(4) { animation-delay: .6s; }
    .pulse {
      animation: pulse 1.6s ease-in-out infinite alternate;
    }
    @keyframes drawLine {
      to { stroke-dashoffset: 0; }
    }
    @keyframes growBar {
      from { transform: scaleY(.45); opacity: .55; }
      to { transform: scaleY(1); opacity: 1; }
    }
    @keyframes pulse {
      from { opacity: .45; }
      to { opacity: 1; }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="680" gradientUnits="userSpaceOnUse">
      <stop stop-color="#09111A"/>
      <stop offset="1" stop-color="#14263A"/>
    </linearGradient>
    <linearGradient id="line" x1="102" y1="430" x2="612" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#35C2FF"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
  </defs>
  <rect width="900" height="680" rx="34" fill="url(#bg)"/>
