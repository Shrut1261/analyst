  <text x="84" y="148" fill="#9EB2C7" font-family="Inter, Arial, sans-serif" font-size="20">Algorithmic trading intelligence platform</text>
  <rect x="664" y="82" width="138" height="44" rx="10" fill="#102C25" stroke="#2DD4BF"/>
  <circle cx="690" cy="104" r="7" fill="#2DD4BF" class="pulse"/>
  <text x="710" y="111" fill="#D7FFF7" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Live MVP</text>
  <g>
