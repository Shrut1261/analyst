  <rect width="900" height="560" rx="28" fill="#0f172a"/>
  <path d="M0 0h900v560H0z" fill="url(#bg)"/>
  <rect x="64" y="58" width="772" height="444" rx="26" fill="#111827" stroke="#314155" stroke-width="2"/>
  <text x="96" y="114" fill="#ffffff" font-family="Segoe UI, Arial" font-size="42" font-weight="800">Retail Demand Intelligence</text>
  <text x="98" y="148" fill="#93c5fd" font-family="Segoe UI, Arial" font-size="18">Forecast demand, stockout risk, and inventory replenishment</text>
  <g transform="translate(96 190)">
